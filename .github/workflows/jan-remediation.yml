name: Jan frontend validation
on:
  push:
    branches: [remediation-ci/jan-validation-20261112]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: vjymisal0/jan
          ref: baf4264020e47447491334d439ce1d10259e79ce
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
      - name: Normal TypeScript build, lint and tests
        run: make test-ts
      - name: Web application build and types
        run: yarn build:web
      - name: Check tracked source preservation
        run: git diff --exit-code
