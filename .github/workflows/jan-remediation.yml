name: Jan frontend validation
on:
  push:
    branches: [remediation-ci/jan-validation-20261112]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: vjymisal0/jan
          ref: c5db93e8b1ae281622ff3779c7748818f216edea
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
      - name: Normal TypeScript build, lint and tests
        run: make test-ts
      - name: Web application build and types
        run: yarn build:web
      - name: Check tracked source preservation
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          # Yarn sorts this existing dependency entry during the normal build.
          # Permit only JSON key ordering, with every dependency value preserved.
          assert set(changed) <= {'web-app/package.json'}, changed
          for name in changed:
              before = subprocess.check_output(['git', 'show', 'HEAD:' + name], text=True)
              after = pathlib.Path(name).read_text()
              assert json.loads(before) == json.loads(after), name
          subprocess.run(['git', 'diff', '--exit-code', '--', '.', ':!web-app/package.json'], check=True)
          PY
