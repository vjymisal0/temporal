name: Reflex route benchmark comparison
on:
  push:
    branches: [remediation-ci/reflex-route-comparison-20261113]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REFLEX_TELEMETRY_ENABLED: 'false'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      CODSPEED_SKIP_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vjymisal0/reflex
          ref: b9008977afacf2bb0e86385568407b803dfe68b4
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14.7'
      - name: Prepare exact base and candidate
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = b9008977afacf2bb0e86385568407b803dfe68b4
          git worktree add --detach ../base cb9ee91c43ec599f1e77e2392c32aa9dd38df4f1
          git diff --exit-code cb9ee91c43ec599f1e77e2392c32aa9dd38df4f1 HEAD -- uv.lock pyproject.toml reflex/route.py tests/benchmarks/test_routes.py
          uv sync --locked --all-extras --dev
          cd ../base
          uv sync --locked --all-extras --dev
      - name: Install the upstream pinned CodSpeed runner
        run: |
          curl -fsSL https://codspeed.io/v5.6.3/install.sh -o "$RUNNER_TEMP/codspeed-install.sh"
          echo "d83f7e2f64e2f9d65fc1ca76e633a4b9cefa217f1cb21f944133fbd562439a6b  $RUNNER_TEMP/codspeed-install.sh" | sha256sum --check
          bash "$RUNNER_TEMP/codspeed-install.sh" --quiet
      - name: Compare route matching on one runner
        run: |
          mkdir -p results
          lscpu > results/hardware.txt
          for sample in base-1 head-1 head-2 base-2; do
            if [[ "$sample" == base-* ]]; then tree=base; else tree=candidate; fi
            mkdir -p "results/$sample"
            codspeed run --skip-upload --mode simulation --simulation-track-subprocess --profile-folder "$GITHUB_WORKSPACE/results/$sample" --working-directory "$GITHUB_WORKSPACE/$tree" -- 'uv run --locked pytest -v tests/benchmarks/test_routes.py -k test_route_matching --codspeed' > "results/$sample.log" 2>&1
            tail -n 30 "results/$sample.log"
          done
      - name: Verify source restoration
        if: ${{ !cancelled() }}
        run: |
          git -C candidate diff --exit-code -- '*.py' uv.lock
          git -C base diff --exit-code -- '*.py' uv.lock
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reflex-route-comparison
          path: results
          include-hidden-files: true
          if-no-files-found: ignore
